 <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.tittel | escape }} – Stein Griller</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #171717;
      color: #f3eee5;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; }

    header {
      border-bottom: 1px solid #444;
      padding: 20px;
    }

    nav {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 32px 20px 64px;
    }

    h1, h2 { line-height: 1.2; }
    h1 { font-size: clamp(30px, 5vw, 48px); }
    h2 { margin-top: 36px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }

    .kort {
      display: block;
      overflow: hidden;
      background: #242424;
      border: 1px solid #444;
      border-radius: 10px;
      text-decoration: none;
    }

    .kort:hover { border-color: #d9ac72; }

    .kort img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .korttekst { padding: 18px; }
    .kort h2 { margin: 0 0 10px; font-size: 24px; }
    .kort p { margin: 0; }

    article {
      max-width: 760px;
      margin: auto;
    }

    .hovedbilde, .galleri img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .hovedbilde { margin: 24px 0; }
    .galleri img { margin-top: 24px; }

    li { margin-bottom: 10px; }
    .info { color: #d9ac72; }

    @media print {
      body { background: white; color: black; }
      header, .tilbake { display: none; }
      main { padding: 0; }
      .galleri { display: none; }
    }

   @media screen and (min-width: 800px) {
  .hovedbilde,
  .galleri img {
    max-height: 550px;
    width: auto;
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
  }
}
   @media screen and (min-width: 800px) {

  /* Oversikten: tre kort per rad, også med få oppskrifter */
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .kort img {
    width: 100%;
    height: 180px;
    aspect-ratio: auto;
    object-fit: cover;
  }

  /* Oppskriften: ekstrabildene ved siden av hverandre */
  .galleri {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    margin-top: 28px;
    align-items: start;
  }

  .galleri img {
    width: 100%;
    max-width: 100%;
    height: auto;
    max-height: 350px;
    object-fit: contain;
    margin: 0;
  }
}
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Stein Griller</a>
      <a href="/oppskrifter/">Oppskrifter</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
